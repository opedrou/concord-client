[package]
name = "concord-client"
version = "0.1.9"
edition = "2024"
license = "MIT"
description = "Cliente desktop nativo do Concord"

[dependencies]
# `advanced`: mede texto pra cortar com reticências (`ui::stage`).
iced = { version = "0.14", features = ["wgpu", "tokio", "image", "svg", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `stream`: progresso do upload de anexo.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
futures-util = "0.3"
livekit = { version = "0.10", features = ["rustls-tls-native-roots"] }
nnnoiseless = "0.5"
rtrb = "0.4"
# Confere o binário baixado pelo autoupdater contra o digest da release.
sha2 = "0.10"
# Hora local das mensagens do chat: a std não sabe o fuso. Já vinha compilado pelo livekit.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
# Áudio da transmissão: WASAPI process loopback, como no spike.
wasapi = "0.26"
# Atalho no Menu Iniciar e "Aplicativos instalados" (`update::win`). A mesma versão que o
# `wasapi` já puxa.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# O libwebrtc embute `pw_*` vazios: linkar libpipewire derruba o processo. Por isso
# `cpal` só pelo backend PulseAudio.
[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
livekit = { version = "0.10", features = ["glib-main-loop"] }

# Resolução dos monitores pelo Mutter, pra saber se a transmissão é tela ou janela. Já vem
# compilado pelo `keyring`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Cópia do livekit 0.10.1 com um patch: manda TF_STEREO quando a fonte tem 2 canais, como o
# livekit-client. Sem isso o áudio da transmissão chega mono (`vendor/livekit`, procurar
# "Concord:"). Até o 0.11.0 o crate não manda. Subir o livekit exige copiar de novo.
[patch.crates-io]
livekit = { path = "vendor/livekit" }

[build-dependencies]
# Ícone embutido no .exe do Windows (`build.rs`).
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
