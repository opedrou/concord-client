[package]
name = "concord-client"
version = "0.1.18"
edition = "2024"
license = "MIT"
description = "Cliente desktop nativo do Concord"

[dependencies]
# `advanced`: mede texto pra cortar com reticências (`ui::stage`).
iced = { version = "0.14", features = ["wgpu", "tokio", "image", "svg", "advanced"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# `stream`: progresso do upload de anexo.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
# Quadro de vídeo que devolve o buffer ao cair (`call::Pool`). Já vem pelo iced.
bytes = "1"
futures-util = "0.3"
livekit = { version = "0.10", features = ["rustls-tls-native-roots"] }
nnnoiseless = "0.5"
rtrb = "0.4"
# Confere o binário baixado pelo autoupdater contra o digest da release.
sha2 = "0.10"
# Hora local das mensagens do chat: a std não sabe o fuso. Já vinha compilado pelo livekit.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Avisos do livekit, do wgpu e a GPU que o iced escolheu, no log do app (`log::Bridge`). Já vem
# pelos dois.
log = "0.4"
# Notificação nativa (`notify`). Fixo na 4.18: a 4.19 puxa o zbus 6, e a árvore está no 5.
notify-rust = "=4.18.2"

[target.'cfg(windows)'.dependencies]
cpal = "0.18"
# Áudio da transmissão: WASAPI process loopback, como no spike.
wasapi = "0.26"
# Atalhos com o AUMID, "Aplicativos instalados" e a pergunta do desinstalar (`update::win`);
# autostart; RAM, threads, handles e memória de vídeo no log (`health`). A mesma versão que o
# `wasapi` já puxa.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
# Ícone na bandeja (`tray`). Só aqui: no Linux ele puxaria o GTK.
tray-icon = { version = "0.26", default-features = false }

# O libwebrtc embute `pw_*` vazios: linkar libpipewire derruba o processo. Por isso
# `cpal` só pelo backend PulseAudio.
[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
livekit = { version = "0.10", features = ["glib-main-loop"] }
# O token do portal que reabre a mesma tela (`share::desktop`). Já vem pelo livekit, e é a
# cópia em `vendor/webrtc-sys`.
webrtc-sys = "0.3"

# Resolução dos monitores pelo Mutter, pra saber se a transmissão é tela ou janela. Já vem
# compilado pelo `keyring`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
# Bandeja pelo StatusNotifierItem (`tray`). Sem o `tokio` padrão, que liga o `zbus/tokio` na
# árvore toda.
ksni = { version = "=0.3.7", default-features = false, features = ["async-io"] }

# Cópia do livekit 0.10.1 com um patch: manda TF_STEREO quando a fonte tem 2 canais, como o
# livekit-client. Sem isso o áudio da transmissão chega mono (`vendor/livekit`, procurar
# "Concord:"). Até o 0.11.0 o crate não manda. Subir o livekit exige copiar de novo.
[patch.crates-io]
livekit = { path = "vendor/livekit" }
# Cópia do webrtc-sys 0.3.53, a versão que o livekit 0.10 fixa, com o encoder VA-API mexido
# (`vendor/webrtc-sys/src/vaapi`, procurar "Concord:"). Subir o livekit exige copiar de novo
# e reaplicar.
webrtc-sys = { path = "vendor/webrtc-sys" }

[build-dependencies]
# Ícone embutido no .exe do Windows (`build.rs`).
winresource = "0.1"

[dev-dependencies]
iced_test = "0.14"
# `Room::publisher_senders`, pro degrau de taxa da bancada da tela. Só entra nos testes.
livekit = { version = "0.10", features = ["__lk-e2e-test"] }
