[package]
name = "concord-client"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cliente desktop nativo do Concord"

[dependencies]
iced = { version = "0.14", features = ["wgpu", "tokio", "image", "svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4"
uuid = { version = "1", features = ["v4"] }
image = "0.25"
futures-util = "0.3"
livekit = { version = "0.10", features = ["rustls-tls-native-roots"] }
nnnoiseless = "0.5"
rtrb = "0.4"

[target.'cfg(windows)'.dependencies]
cpal = "0.18"

# O libwebrtc embute `pw_*` vazios: linkar libpipewire derruba o processo. Por isso
# `cpal` só pelo backend PulseAudio.
[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.18", features = ["pulseaudio"] }
livekit = { version = "0.10", features = ["glib-main-loop"] }

# Resolução dos monitores pelo Mutter, pra saber se a transmissão é tela ou janela. Já vem
# compilado pelo `keyring`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

[dev-dependencies]
iced_test = "0.14"
